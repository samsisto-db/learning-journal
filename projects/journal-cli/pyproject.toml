[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "journal-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["typer>=0.12"]

[project.scripts]
journal = "journal_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/journal_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
